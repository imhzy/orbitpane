<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20"/>
      <stop offset="50%" stop-color="#151030"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>

    <!-- Core Brand Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="80%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  
  <!-- Outer Glow Halo -->
  <circle cx="256" cy="256" r="160" fill="url(#neonGrad)" opacity="0.25" filter="url(#softGlow)"/>

  <!-- Orbital Rings (Representing OrbitPane's connected agent workspace) -->
  <g transform="translate(256, 256) rotate(-25)">
    <ellipse cx="0" cy="0" rx="180" ry="60" fill="none" stroke="url(#neonGrad)" stroke-width="8" opacity="0.4" stroke-dasharray="12 16"/>
    <ellipse cx="0" cy="0" rx="180" ry="60" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="80 300" filter="url(#coreGlow)"/>
  </g>

  <!-- Central OrbitPane Symbol: Floating Diamond-Sparkle Core -->
  <g transform="translate(256, 256)">
    <!-- Central Glowing Core Star -->
    <path d="M 0 -130 Q 0 0 -130 0 Q 0 0 0 130 Q 0 0 130 0 Q 0 0 0 -130 Z" fill="url(#neonGrad)" filter="url(#coreGlow)"/>
    
    <!-- Inner Radiant Sparkle -->
    <path d="M 0 -85 Q 0 0 -85 0 Q 0 0 0 85 Q 0 0 85 0 Q 0 0 0 -85 Z" fill="url(#sparkleGrad)"/>
    
    <!-- Small Orbiting Satellites / Nodes -->
    <circle cx="-110" cy="-90" r="14" fill="url(#sparkleGrad)" filter="url(#coreGlow)"/>
    <circle cx="120" cy="80" r="10" fill="url(#accentGrad)" filter="url(#coreGlow)"/>
    <circle cx="100" cy="-110" r="8" fill="#E0E7FF"/>
  </g>
</svg>

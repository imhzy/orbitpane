<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0b" />
    <meta name="background-color" content="#0c0c0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent. On iOS that style gives a standalone web app a
         full-bleed *origin* but a status-bar-shortened *height*: the layout
         viewport starts at y=0, under the notch, yet innerHeight comes back as
         screen height minus the top inset (797 of 844 on an iPhone 14). The
         missing 47px land at the bottom, outside the viewport, where nothing
         can be laid out and only the propagated body background paints — the
         band under the composer that no amount of padding would close. It also
         poisons env(safe-area-inset-bottom), which then marks a strip 47px
         above the real home indicator as unsafe. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="OrbitPane" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- The workspace is private and a /s/ share link is an unlisted capability
         URL, so nothing served from this origin should ever be indexed, and the
         token in the address bar must not ride along in outbound Referer
         headers when a reader clicks a link inside a shared conversation. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>OrbitPane</title>
    <meta name="description" content="OrbitPane - Secure, self-hosted coding agent workspace" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Response headers for every OrbitPane route.
#
# Kept in a snippet and included per-location on purpose: nginx's `add_header`
# is replace-not-merge, so a location that adds a single header of its own drops
# every header inherited from `server`. Including this file in each location is
# the standard way to keep that footgun from silently disabling the whole set.
#
# `always` so the headers survive 4xx/5xx too — an error page is still a page.

# TLS only, for a year. Not `includeSubDomains`: the certificate is a wildcard
# shared with unrelated hosts, and this config speaks for one of them.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;

# `frame-ancestors` below is the real control; X-Frame-Options is here for
# browsers that never learned it.
add_header X-Frame-Options "DENY" always;

# The app renders Markdown written by an agent, and a share link hands that
# rendering to strangers. Everything executable is same-origin and hashed by
# Vite, so `script-src 'self'` is exact rather than aspirational.
#
#   style-src 'unsafe-inline' — React and framer-motion write inline styles.
#   img-src https:             — Markdown may legitimately reference images.
#   connect-src wss://$host    — the chat socket; CSP3 folds this into 'self',
#                                but older Safari does not.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss://$host; worker-src 'self' blob:; manifest-src 'self'" always;

# Nothing here needs hardware.
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;

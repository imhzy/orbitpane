# Share tokens are capability URLs: the token in the path is the entire
# credential. Access logs get copied, tailed and pasted around far more casually
# than databases do, so the token is masked before it is ever written. Logging
# the request line via $request would defeat this — the method and the masked
# URI are assembled by hand instead.
map $request_uri $orbitpane_logged_uri {
	default            $request_uri;
	"~^/s/"            "/s/<redacted>";
	"~^/api/shared/"   "/api/shared/<redacted>";
}

log_format orbitpane '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $orbitpane_logged_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# orbitpane.hzycode.com HTTP -> HTTPS
server {
	listen 80;
	server_name orbitpane.hzycode.com;
	return 301 https://$host$request_uri;
}

# orbitpane.hzycode.com HTTPS
server {
	listen 443 ssl;
	server_name orbitpane.hzycode.com;

	access_log /var/log/nginx/orbitpane.access.log orbitpane;

	ssl_certificate /etc/nginx/cert/wildcard/hzycode.com.crt;
	ssl_certificate_key /etc/nginx/cert/wildcard/hzycode.com.key;

	ssl_session_timeout 5m;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
	ssl_prefer_server_ciphers on;

	location /api/ {
		# No Referrer-Policy or Cache-Control here: the backend sets both, and
		# it varies them per route (`no-referrer` and `no-store` for the public
		# share read). A second header from nginx would win and flatten that.
		include snippets/orbitpane-security.conf;

		proxy_pass http://127.0.0.1:8005/api/;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	# The share route serves the same SPA shell as everything else, but it is
	# the one URL a stranger can hold, so it gets its own rules.
	location ^~ /s/ {
		include snippets/orbitpane-security.conf;

		# Belt and braces with the <meta> tags in index.html: a crawler that
		# somehow learns a link must not index it, and the token must not ride
		# along in the Referer of anything the reader clicks.
		add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
		add_header Referrer-Policy "no-referrer" always;

		# The URL itself is the secret, so no shared cache should hold a copy
		# keyed by it.
		add_header Cache-Control "no-store" always;

		root /srv/orbitpane/frontend/dist;
		# Every argument is a file, so nginx serves it from inside this block. A
		# fallback ending in a URI (`try_files $uri /index.html`) would instead
		# internally redirect into `location /` — and because `add_header` is
		# replace-not-merge, the three headers above would silently vanish from
		# the response. Nothing is served from under /s/ except the shell.
		try_files /index.html =404;
	}

	location / {
		include snippets/orbitpane-security.conf;
		add_header Referrer-Policy "no-referrer" always;

		root /srv/orbitpane/frontend/dist;
		index index.html;
		try_files $uri $uri/ /index.html;
	}
}
